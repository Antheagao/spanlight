[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spanlight"
version = "0.1.0"
description = "Self-hosted LLM observability: traces, spans, token and cost accounting, latency stats. One small server, one dashboard, no vendor accounts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anthony Mendez" }]
# The SDK is stdlib-only: `pip install spanlight` must work anywhere the
# traced app runs. The server's web stack is an extra.
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    # Test oracles for the hand-written OTLP decoder (docs/adr/0002); never
    # imported by the server or the SDK.
    "opentelemetry-proto>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
include = ["spanlight*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
